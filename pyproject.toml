[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filepilot"
version = "0.1.0"
description = "FilePilot - 现代 Windows 文件管理与智能下载工具"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "FilePilot Contributors" }]
keywords = ["download-manager", "file-manager", "pyside6", "aiohttp", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "PySide6>=6.9",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.9",
    "ruff>=0.6",
]

[project.scripts]
filepilot = "app.main:main"

[project.gui-scripts]
filepilot-gui = "app.main:main"

[project.urls]
Homepage = "https://github.com/huaz52029-lab/FilePilot-"
Repository = "https://github.com/huaz52029-lab/FilePilot-"
Issues = "https://github.com/huaz52029-lab/FilePilot-/issues"
Changelog = "https://github.com/huaz52029-lab/FilePilot-/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/styles/*.qss", "resources/icons/*.svg", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "network: 需要外网连接的测试（默认跳过）",
]

[tool.ruff]
line-length = 110
target-version = "py313"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
